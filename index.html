<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>通知氛围灯效果设置 - 多语言交互原型</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 桌面端调试控制台：可快速切换多语言与布局形态 -->
  <aside class="demo-controller">
    <div class="controller-card">
      <div class="controller-header">
        <span class="controller-badge">原型调试台</span>
        <h3>多语言与排版预览</h3>
      </div>
      
      <div class="ctrl-group">
        <label for="langSelect">选择系统语言 (Language):</label>
        <div class="select-wrapper">
          <select id="langSelect" onchange="switchLanguage(this.value)">
            <option value="zh-CN" selected>🇨🇳 中文 (简体)</option>
            <option value="en-US">🇺🇸 English (US)</option>
            <option value="de-DE">🇩🇪 Deutsch (德语 - 较长字符测试)</option>
            <option value="es-ES">🇪🇸 Español (西班牙语)</option>
            <option value="ru-RU">🇷🇺 Русский (俄语 - 宽字符测试)</option>
            <option value="fr-FR">🇫🇷 Français (法语)</option>
            <option value="ja-JP">🇯🇵 日本語 (日语)</option>
          </select>
        </div>
      </div>

      <div class="ctrl-group">
        <label>灯效展示布局 (已定稿默认选1):</label>
        <div class="mode-toggles layout-picker-toggles">
          <button type="button" class="mode-btn active" id="btnModeScroll" onclick="setLayoutMode('scroll')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
            横向自适应滑动 (轻量单行 ✓)
          </button>
        </div>
      </div>

      <div class="ctrl-group">
        <label>脉动图标方案 (已选定方案4):</label>
        <div class="mode-toggles pulse-opt-toggles">
          <button type="button" class="mode-btn active pulse-opt-btn" data-pulse-opt="opt_d" onclick="switchPulseIcon('opt_d')">
            <span class="opt-tag">方案4</span> 能量脉冲节拍柱 (已选定 ✓)
          </button>
        </div>
      </div>

      <div class="ctrl-group">
        <label>选中效果风格 (随颜色选择动态联动):</label>
        <div class="mode-toggles">
          <button type="button" class="mode-btn active" id="btnStyleBlue" onclick="setActiveStyle('blue')">
            ✦ 随选色动态描边 (已选定 ✓)
          </button>
        </div>
      </div>

      <div class="ctrl-group">
        <label>当前生效光效数据状态:</label>
        <div class="state-chip-box">
          <span class="state-chip" id="chipEffect">灯效: 呼吸</span>
          <span class="state-chip" id="chipColor">颜色: 深绿</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- 移动端手机框架容器 -->
  <main class="phone-viewport">
    <div class="phone-frame">
      <!-- 手机顶部状态栏 -->
      <header class="status-bar">
        <span class="time" id="statusTime">16:37</span>
        <div class="status-icons">
          <svg class="icon-signal" width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
            <rect x="0" y="9" width="2.5" height="3" rx="0.5"/>
            <rect x="4.5" y="6" width="2.5" height="6" rx="0.5"/>
            <rect x="9" y="3" width="2.5" height="9" rx="0.5"/>
            <rect x="13.5" y="0" width="2.5" height="12" rx="0.5"/>
          </svg>
          <svg class="icon-wifi" width="15" height="12" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3C7.3 3 3.1 4.9 0 8l1.4 1.4C4.1 6.6 7.8 5 12 5s7.9 1.6 10.6 4.4L24 8C20.9 4.9 16.7 3 12 3zm0 4.5c-3.5 0-6.6 1.4-8.8 3.7L4.6 12.6C6.5 10.7 9.1 9.5 12 9.5s5.5 1.2 7.4 3.1l1.4-1.4C18.6 8.9 15.5 7.5 12 7.5zm0 4.5c-2.2 0-4.2.9-5.6 2.3l1.4 1.4c1.1-1.1 2.6-1.7 4.2-1.7s3.1.6 4.2 1.7l1.4-1.4c-1.4-1.4-3.4-2.3-5.6-2.3zm0 4.5c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
          <div class="battery-indicator">
            <span class="battery-bolt">×</span>
            <span class="battery-level">11</span>
          </div>
        </div>
      </header>

      <!-- 顶部导航栏 -->
      <nav class="nav-bar">
        <button class="btn-back" aria-label="返回">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <h1 class="nav-title" data-i18n="notification_title">通知</h1>
      </nav>

      <!-- 主滚动内容区 -->
      <div class="scroll-content">
        <!-- 顶部硬件设备展示卡片与灯效模拟（全新 DYNAMIC SOUND 模组） -->
        <section class="device-card-container">
          <div class="device-mockup-new">
            <img src="./assets/device_clean.png" alt="Dynamic Sound Device" class="device-clean-img">
            <!-- 覆盖在 DYNAMIC SOUND 发光环上的动态光效层 -->
            <div class="halo-ring-emitter" id="haloRingEmitter">
              <div class="halo-core-ring"></div>
              <div class="halo-ambient-glow"></div>
            </div>
          </div>
        </section>

        <!-- 卡片一：通知总开关与生效应用 -->
        <section class="settings-card">
          <div class="setting-row">
            <span class="setting-label" data-i18n="notification_switch">通知</span>
            <label class="switch-toggle">
              <input type="checkbox" id="notificationToggle" checked onchange="toggleNotification(this.checked)">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="setting-divider"></div>
          <div class="setting-row clickable" onclick="alert('进入生效应用列表页面')">
            <span class="setting-label" data-i18n="effective_apps">生效的应用</span>
            <div class="row-arrow">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </div>
          </div>
        </section>

        <!-- 卡片二：效果选择（重构核心）与颜色选择 -->
        <section class="settings-card">
          <!-- 效果模块：支持横向自适应滑动与胶囊按钮设计 -->
          <div class="effect-module-wrapper">
            <div class="section-title-row">
              <span class="setting-label" data-i18n="effect_title">灯效</span>
              <span class="current-effect-hint" id="currentEffectHint" data-i18n="effect_breathing">呼吸</span>
            </div>

            <!-- 胶囊选择器：多语言自适应排版容器（全6种灯效） -->
            <div class="capsules-scroller-wrap layout-scroll active-style-blue" id="capsulesScrollerWrap">
              <div class="capsules-track" id="capsulesTrack">
                
                <!-- 1. 呼吸 -->
                <button type="button" class="capsule-btn active" data-effect="breathing" onclick="selectEffect('breathing')">
                  <span class="capsule-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                      <defs>
                        <linearGradient id="gradBreathing" x1="0%" y1="100%" x2="100%" y2="0%">
                          <stop offset="0%" stop-color="#06b6d4"/>
                          <stop offset="50%" stop-color="#3b82f6"/>
                          <stop offset="100%" stop-color="#a855f7"/>
                        </linearGradient>
                      </defs>
                      <circle cx="12" cy="12" r="4.2" fill="url(#gradBreathing)"/>
                      <circle cx="12" cy="4" r="1.4" fill="url(#gradBreathing)"/>
                      <circle cx="18" cy="6" r="1.3" fill="url(#gradBreathing)"/>
                      <circle cx="20" cy="12" r="1.4" fill="url(#gradBreathing)"/>
                      <circle cx="18" cy="18" r="1.3" fill="url(#gradBreathing)"/>
                      <circle cx="12" cy="20" r="1.4" fill="url(#gradBreathing)"/>
                      <circle cx="6" cy="18" r="1.3" fill="url(#gradBreathing)"/>
                      <circle cx="4" cy="12" r="1.4" fill="url(#gradBreathing)"/>
                      <circle cx="6" cy="6" r="1.3" fill="url(#gradBreathing)"/>
                    </svg>
                  </span>
                  <span class="capsule-text" data-i18n="effect_breathing">呼吸</span>
                  <span class="check-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </span>
                </button>

                <!-- 2. 脉动 (方案4: 能量脉冲节拍柱) -->
                <button type="button" class="capsule-btn" data-effect="pulsing" onclick="selectEffect('pulsing')">
                  <span class="capsule-icon" id="pulsingIconWrap">
                    <svg viewBox="0 0 24 24" fill="none">
                      <defs>
                        <linearGradient id="gradPulseD" x1="0%" y1="100%" x2="0%" y2="0%">
                          <stop offset="0%" stop-color="#f59e0b"/>
                          <stop offset="50%" stop-color="#ef4444"/>
                          <stop offset="100%" stop-color="#ec4899"/>
                        </linearGradient>
                      </defs>
                      <rect x="3.5" y="9" width="3" height="6" rx="1.5" fill="url(#gradPulseD)" opacity="0.6"/>
                      <rect x="8.5" y="4.5" width="3" height="15" rx="1.5" fill="url(#gradPulseD)"/>
                      <rect x="13.5" y="7.5" width="3" height="9" rx="1.5" fill="url(#gradPulseD)" opacity="0.85"/>
                      <rect x="18.5" y="10.5" width="3" height="3" rx="1.5" fill="url(#gradPulseD)" opacity="0.45"/>
                    </svg>
                  </span>
                  <span class="capsule-text" data-i18n="effect_pulsing">脉动</span>
                  <span class="check-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </span>
                </button>

                <!-- 3. 流光 (正圆环流光，彻底解决扁平感，纯正圆无底部点) -->
                <button type="button" class="capsule-btn" data-effect="streamer" onclick="selectEffect('streamer')">
                  <span class="capsule-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                      <!-- 基础正圆闭合环 (360°标准正圆，纯单色底光) -->
                      <circle cx="12" cy="12" r="8.5" stroke="#3b82f6" stroke-width="1.8" stroke-opacity="0.28"/>
                      <!-- 正半圆流光高光弧 (严格基于同一正圆半径8.5，从水平赤道中线饱满展开，绝对正圆不扁) -->
                      <path d="M 3.5 12 A 8.5 8.5 0 0 0 20.5 12" stroke="#3b82f6" stroke-width="2.6" stroke-linecap="round"/>
                    </svg>
                  </span>
                  <span class="capsule-text" data-i18n="effect_streamer">流光</span>
                  <span class="check-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </span>
                </button>

                <!-- 4. 流水 (270°水流光弧追逐，带暗区截断) -->
                <button type="button" class="capsule-btn" data-effect="waterflow" onclick="selectEffect('waterflow')">
                  <span class="capsule-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                      <defs>
                        <linearGradient id="gradWaterflow" x1="0%" y1="0%" x2="100%" y2="100%">
                          <stop offset="0%" stop-color="#06b6d4"/>
                          <stop offset="50%" stop-color="#0ea5e9"/>
                          <stop offset="100%" stop-color="#10b981"/>
                        </linearGradient>
                      </defs>
                      <!-- 270度流动光弧，左上角暗区缺口对齐参考图 -->
                      <path d="M 12 3.5 A 8.5 8.5 0 1 1 3.5 12" stroke="url(#gradWaterflow)" stroke-width="2.8" stroke-linecap="round"/>
                      <!-- 水流头部圆润光点 -->
                      <circle cx="12" cy="3.5" r="2.2" fill="url(#gradWaterflow)"/>
                    </svg>
                  </span>
                  <span class="capsule-text" data-i18n="effect_waterflow">流水</span>
                  <span class="check-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </span>
                </button>

                <!-- 5. 彩色律动 -->
                <button type="button" class="capsule-btn" data-effect="color_rhythm" onclick="selectEffect('color_rhythm')">
                  <span class="capsule-icon">
                    <!-- 波浪律动多线条：层叠彩色渐变 -->
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.3" stroke-linecap="round">
                      <defs>
                        <linearGradient id="gradWave1" x1="0%" y1="0%" x2="100%" y2="0%">
                          <stop offset="0%" stop-color="#f43f5e"/>
                          <stop offset="100%" stop-color="#ec4899"/>
                        </linearGradient>
                        <linearGradient id="gradWave2" x1="0%" y1="0%" x2="100%" y2="0%">
                          <stop offset="0%" stop-color="#8b5cf6"/>
                          <stop offset="100%" stop-color="#3b82f6"/>
                        </linearGradient>
                        <linearGradient id="gradWave3" x1="0%" y1="0%" x2="100%" y2="0%">
                          <stop offset="0%" stop-color="#06b6d4"/>
                          <stop offset="100%" stop-color="#10b981"/>
                        </linearGradient>
                      </defs>
                      <path d="M3 8c2.5-2.2 5.5-2.2 8 0s5.5 2.2 8 0" stroke="url(#gradWave1)"/>
                      <path d="M3 13c2.5-2.2 5.5-2.2 8 0s5.5 2.2 8 0" stroke="url(#gradWave2)"/>
                      <path d="M3 18c2.5-2.2 5.5-2.2 8 0s5.5 2.2 8 0" stroke="url(#gradWave3)"/>
                    </svg>
                  </span>
                  <span class="capsule-text" data-i18n="effect_color_rhythm">彩色律动</span>
                  <span class="check-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </span>
                </button>

                <!-- 6. 四色律动 -->
                <button type="button" class="capsule-btn" data-effect="four_color" onclick="selectEffect('four_color')">
                  <span class="capsule-icon four-color-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                      <rect x="3.5" y="3.5" width="7" height="7" rx="2" fill="#ef4444" stroke="none"/>
                      <rect x="13.5" y="3.5" width="7" height="7" rx="2" fill="#3b82f6" stroke="none"/>
                      <rect x="3.5" y="13.5" width="7" height="7" rx="2" fill="#22c55e" stroke="none"/>
                      <rect x="13.5" y="13.5" width="7" height="7" rx="2" fill="#eab308" stroke="none"/>
                    </svg>
                  </span>
                  <span class="capsule-text" data-i18n="effect_four_color">四色律动</span>
                  <span class="check-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </span>
                </button>

              </div>
            </div>
          </div>

          <div class="setting-divider"></div>

          <!-- 颜色选择模块（新图方案：5快捷单色 + 全彩大色轮） -->
          <div class="color-module-wrapper">
            <div class="section-title-row">
              <span class="setting-label" data-i18n="color_select">颜色选择</span>
              <span class="current-color-hint" id="currentColorLabel" data-i18n="color_dark_green">深绿</span>
            </div>

            <!-- 5个单色快捷圆圈 -->
            <div class="color-presets-row" id="colorPresetsRow">
              <div class="color-circle-btn" data-color="#55c800" data-name-key="color_grass_green" onclick="selectPresetColor(this, '#55c800', 'color_grass_green')">
                <span class="swatch" style="background-color: #55c800;"></span>
              </div>
              <div class="color-circle-btn" data-color="#fca86c" data-name-key="color_peach_orange" onclick="selectPresetColor(this, '#fca86c', 'color_peach_orange')">
                <span class="swatch" style="background-color: #fca86c;"></span>
              </div>
              <div class="color-circle-btn" data-color="#7ba5e4" data-name-key="color_fog_blue" onclick="selectPresetColor(this, '#7ba5e4', 'color_fog_blue')">
                <span class="swatch" style="background-color: #7ba5e4;"></span>
              </div>
              <div class="color-circle-btn" data-color="#61e3d7" data-name-key="color_cyan_blue" onclick="selectPresetColor(this, '#61e3d7', 'color_cyan_blue')">
                <span class="swatch" style="background-color: #61e3d7;"></span>
              </div>
              <div class="color-circle-btn active" data-color="#00a838" data-name-key="color_dark_green" onclick="selectPresetColor(this, '#00a838', 'color_dark_green')">
                <span class="swatch" style="background-color: #00a838;"></span>
              </div>
            </div>

            <!-- 全彩拾色大圆盘 (Color Wheel) -->
            <div class="color-wheel-wrapper">
              <div class="color-wheel-box" id="colorWheelBox" onclick="pickColorFromWheel(event)">
                <img src="./assets/color_wheel_hd.png" alt="Color Wheel" class="wheel-hd-img" id="wheelImg">
                <!-- 取色圆环指针 -->
                <div class="wheel-picker-thumb" id="wheelThumb" style="left: 28%; top: 78%;">
                  <span class="thumb-core" id="thumbCore" style="background-color: #00a838;"></span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- 底部安全区条 -->
      <footer class="home-indicator">
        <div class="bar"></div>
      </footer>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
