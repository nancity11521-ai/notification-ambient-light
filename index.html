<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>通知氛围灯效果设置 - 多语言交互原型 (DYNAMIC SOUND)</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- 桌面端悬浮语言切换栏 (仅在宽屏展示，不侵入移动端 APP) -->
  <aside class="desktop-lang-bar">
    <span class="desktop-lang-icon">🌐</span>
    <label for="desktopLangSelect">语言 / Language:</label>
    <select id="desktopLangSelect" onchange="switchLanguage(this.value)">
      <option value="zh-CN" selected>🇨🇳 中文 (简体)</option>
      <option value="en-US">🇺🇸 English (US)</option>
      <option value="de-DE">🇩🇪 Deutsch</option>
      <option value="es-ES">🇪🇸 Español</option>
      <option value="ru-RU">🇷🇺 Русский</option>
      <option value="fr-FR">🇫🇷 Français</option>
      <option value="ja-JP">🇯🇵 日本語</option>
    </select>
  </aside>

  <!-- 移动端手机框架容器 -->
  <main class="phone-viewport">
    <div class="phone-frame">
      <!-- 手机顶部状态栏 -->
      <header class="status-bar">
        <div class="status-left">
          <span class="status-time" id="statusTime">09:24</span>
          <button type="button" class="status-gear-btn" onclick="toggleLanguageSheet(true)" aria-label="语言设置" title="切换语言">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>
        <div class="status-icons">
          <svg class="icon-signal" width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
            <rect x="0" y="9" width="2.5" height="3" rx="0.5"/>
            <rect x="4.5" y="6" width="2.5" height="6" rx="0.5"/>
            <rect x="9" y="3" width="2.5" height="9" rx="0.5"/>
            <rect x="13.5" y="0" width="2.5" height="12" rx="0.5"/>
          </svg>
          <div class="wifi-indicator">
            <svg class="icon-wifi" width="15" height="12" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 18c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm-4.9-3.5c2.7-2.7 7.1-2.7 9.8 0l1.4-1.4c-3.5-3.5-9.1-3.5-12.6 0l1.4 1.4zm-3.5-3.5c4.6-4.6 12.2-4.6 16.8 0l1.4-1.4c-5.4-5.4-14.2-5.4-19.6 0l1.4 1.4z"/>
            </svg>
            <span class="wifi-badge">6</span>
          </div>
          <div class="battery-indicator">
            <span class="battery-level">53</span>
          </div>
        </div>
      </header>

      <!-- 顶部导航栏 -->
      <!-- 顶部导航标题栏（二级页面展示：返回键 + 左对齐大标题） -->
      <header class="app-header" id="mainNavBar" style="display: none;">
        <button type="button" class="btn-back" id="btnNavBack" onclick="goBackToHome()" aria-label="返回">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#181818" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 19 12 H 5 M 12 19 L 5 12 L 12 5"/>
          </svg>
        </button>
        <h1 class="nav-title" id="navTitle">来电</h1>
      </header>

      <!-- 场景视图 1: 幻彩脉动 (主首页) -->
      <div class="page-view active" id="view_home">
        <section class="device-card-container">
          <div class="device-mockup-new fx-color_rhythm" id="mockup_home">
            <img src="./assets/device_clean.png" alt="Dynamic Sound Device" class="device-clean-img">
            <div class="halo-ring-emitter" id="haloEmitter_home">
              <div class="halo-core-ring"></div>
              <div class="halo-ambient-glow"></div>
            </div>
          </div>
        </section>
        <div class="sub-hint-text" data-i18n="magic_pulse_hint">在低电量、省电模式、勿扰模式、睡眠模式下幻彩脉动功能不可用</div>

        <!-- 主控卡片：总开关、启用时段 -->
        <section class="settings-card" id="card_master">
          <div class="setting-row">
            <span class="setting-label" data-i18n="magic_pulse_switch">幻彩脉动</span>
            <label class="switch-toggle">
              <input type="checkbox" id="switch_master" checked onchange="toggleMasterPulse(this.checked)">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="master-controlled-content" id="masterControlledContent">
            <div class="setting-divider"></div>
            <div class="setting-row clickable" onclick="handleActiveTimeRowClick()">
              <span class="setting-label" data-i18n="active_time">启用时段</span>
              <div class="row-meta">
                <span class="row-status" id="homeActiveTimeSummary">14:26 - 23:00</span>
                <svg class="row-chevron" width="8" height="15" viewBox="0 0 8 15" fill="none">
                  <path d="M 1.5 1.5 L 6.5 7.5 L 1.5 13.5" stroke="#c2c2c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
          </div>
        </section>

        <!-- 亮度分组标题与卡片 (1:1对齐参考图规范) -->
        <div class="card-group-title" id="title_brightness" data-i18n="brightness">亮度</div>
        <section class="settings-card" id="card_brightness">
          <div class="brightness-control-row">
            <div class="brightness-pill-slider-box">
              <button type="button" class="sun-btn sun-btn-left" onclick="setBrightnessGear(20)" aria-label="1档 (20%)" title="最低亮度">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="12" r="3.8" fill="currentColor"/>
                  <line x1="12" y1="2.2" x2="12" y2="5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <line x1="12" y1="19" x2="12" y2="21.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <line x1="2.2" y1="12" x2="5" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <line x1="19" y1="12" x2="21.8" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <line x1="5.1" y1="5.1" x2="7.1" y2="7.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <line x1="16.9" y1="16.9" x2="18.9" y2="18.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <line x1="5.1" y1="18.9" x2="7.1" y2="16.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <line x1="16.9" y1="7.1" x2="18.9" y2="5.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </button>
              <div class="pill-slider-track-wrap" id="pillSliderTrackWrap">
                <div class="slider-fill-line" id="sliderFillLine">
                  <span class="slider-thumb-dot" id="sliderThumbDot"></span>
                </div>
                <input type="range" min="20" max="100" step="1" value="80" class="pill-range-slider" id="homeBrightnessSlider" oninput="handleBrightnessInput(this.value)" onchange="handleBrightnessChange(this.value)">
              </div>
              <button type="button" class="sun-btn sun-btn-right" onclick="setBrightnessGear(100)" aria-label="5档 (100%)" title="最高亮度">
                <svg width="25" height="25" viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="12" r="5" fill="currentColor"/>
                  <line x1="12" y1="1.8" x2="12" y2="4.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                  <line x1="12" y1="19.2" x2="12" y2="22.2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                  <line x1="1.8" y1="12" x2="4.8" y2="12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                  <line x1="19.2" y1="12" x2="22.2" y2="12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                  <line x1="4.8" y1="4.8" x2="6.9" y2="6.9" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                  <line x1="17.1" y1="17.1" x2="19.2" y2="19.2" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                  <line x1="4.8" y1="19.2" x2="6.9" y2="17.1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                  <line x1="17.1" y1="6.9" x2="19.2" y2="4.8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>
        </section>

        <!-- 场景功能列表卡片 -->
        <section class="settings-card" id="card_scenes_list">
          <div class="setting-row">
            <span class="setting-label" data-i18n="scene_party">派对</span>
            <label class="switch-toggle">
              <input type="checkbox" id="switch_party" checked onchange="togglePartyMode(this.checked)">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="setting-divider"></div>
          <div class="setting-row clickable" onclick="handleSceneRowClick('call')">
            <span class="setting-label" data-i18n="scene_call">来电</span>
            <div class="row-meta">
              <span class="row-status" id="statusText_call" data-i18n="status_enabled">已开启</span>
              <svg class="row-chevron" width="8" height="15" viewBox="0 0 8 15" fill="none">
                <path d="M 1.5 1.5 L 6.5 7.5 L 1.5 13.5" stroke="#c2c2c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <div class="setting-divider"></div>
          <div class="setting-row clickable" onclick="handleSceneRowClick('notification')">
            <span class="setting-label" data-i18n="scene_notification">通知</span>
            <div class="row-meta">
              <span class="row-status" id="statusText_notification" data-i18n="status_enabled">已开启</span>
              <svg class="row-chevron" width="8" height="15" viewBox="0 0 8 15" fill="none">
                <path d="M 1.5 1.5 L 6.5 7.5 L 1.5 13.5" stroke="#c2c2c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <div class="setting-divider"></div>
          <div class="setting-row clickable" onclick="handleSceneRowClick('charging')">
            <span class="setting-label" data-i18n="scene_charging">充电</span>
            <div class="row-meta">
              <span class="row-status" id="statusText_charging" data-i18n="status_enabled">已开启</span>
              <svg class="row-chevron" width="8" height="15" viewBox="0 0 8 15" fill="none">
                <path d="M 1.5 1.5 L 6.5 7.5 L 1.5 13.5" stroke="#c2c2c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <div class="setting-divider"></div>
          <div class="setting-row clickable" onclick="handleSceneRowClick('music')">
            <span class="setting-label" data-i18n="scene_music">音乐</span>
            <div class="row-meta">
              <span class="row-status" id="statusText_music" data-i18n="status_enabled">已开启</span>
              <svg class="row-chevron" width="8" height="15" viewBox="0 0 8 15" fill="none">
                <path d="M 1.5 1.5 L 6.5 7.5 L 1.5 13.5" stroke="#c2c2c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
          <div class="setting-divider"></div>
          <div class="setting-row clickable" onclick="handleSceneRowClick('power')">
            <span class="setting-label" data-i18n="scene_power">开关机</span>
            <div class="row-meta">
              <span class="row-status" id="statusText_power" data-i18n="status_enabled">已开启</span>
              <svg class="row-chevron" width="8" height="15" viewBox="0 0 8 15" fill="none">
                <path d="M 1.5 1.5 L 6.5 7.5 L 1.5 13.5" stroke="#c2c2c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </section>
      </div>

      <!-- 场景视图 2: 来电 (Incoming Call) -->
      <div class="page-view" id="view_call">
        <section class="device-card-container">
          <div class="device-mockup-new fx-breathing" id="mockup_call">
            <img src="./assets/device_clean.png" alt="Dynamic Sound Device" class="device-clean-img">
            <div class="halo-ring-emitter" id="haloEmitter_call">
              <div class="halo-core-ring"></div>
              <div class="halo-ambient-glow"></div>
            </div>
          </div>
        </section>
        <section class="settings-card">
          <div class="setting-row">
            <span class="setting-label" data-i18n="scene_call">来电</span>
            <label class="switch-toggle">
              <input type="checkbox" id="switch_call" checked onchange="toggleSceneSwitch('call', this.checked)">
              <span class="toggle-slider"></span>
            </label>
          </div>
        </section>

        <section class="settings-card">
          <!-- 效果模块：浅色高质感胶囊 + 随选色动态联动描边 -->
          <div class="effect-module-wrapper">
            <div class="section-title-row">
              <span class="setting-label" data-i18n="effect_title">灯效</span>
              <span class="current-effect-hint" id="effectHint_call" data-i18n="effect_breathing">呼吸</span>
            </div>

            <!-- 胶囊选择器：精简指定灯效（来电：呼吸、脉动） -->
            <div class="capsules-scroller-wrap layout-scroll active-style-blue" id="capsulesWrap_call">
              <div class="capsules-track" id="capsulesTrack_call">
                <!-- 呼吸 -->
                <button type="button" class="capsule-btn active" data-effect="breathing" onclick="selectSceneEffect('call', 'breathing')">
                  <span class="capsule-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                      <defs>
                        <linearGradient id="gradBreathing_call" x1="0%" y1="100%" x2="100%" y2="0%">
                          <stop offset="0%" stop-color="#06b6d4"/>
                          <stop offset="50%" stop-color="#3b82f6"/>
                          <stop offset="100%" stop-color="#a855f7"/>
                        </linearGradient>
                      </defs>
                      <circle cx="12" cy="12" r="4.2" fill="url(#gradBreathing_call)"/>
                      <circle cx="12" cy="4" r="1.4" fill="url(#gradBreathing_call)"/>
                      <circle cx="18" cy="6" r="1.3" fill="url(#gradBreathing_call)"/>
                      <circle cx="20" cy="12" r="1.4" fill="url(#gradBreathing_call)"/>
                      <circle cx="18" cy="18" r="1.3" fill="url(#gradBreathing_call)"/>
                      <circle cx="12" cy="20" r="1.4" fill="url(#gradBreathing_call)"/>
                      <circle cx="6" cy="18" r="1.3" fill="url(#gradBreathing_call)"/>
                      <circle cx="4" cy="12" r="1.4" fill="url(#gradBreathing_call)"/>
                      <circle cx="6" cy="6" r="1.3" fill="url(#gradBreathing_call)"/>
                    </svg>
                  </span>
                  <span class="capsule-text" data-i18n="effect_breathing">呼吸</span>
                  <span class="check-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </span>
                </button>
                <!-- 脉动 -->
                <button type="button" class="capsule-btn " data-effect="pulsing" onclick="selectSceneEffect('call', 'pulsing')">
                  <span class="capsule-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                      <defs>
                        <linearGradient id="gradPulseD_call" x1="0%" y1="100%" x2="0%" y2="0%">
                          <stop offset="0%" stop-color="#f59e0b"/>
                          <stop offset="50%" stop-color="#ef4444"/>
                          <stop offset="100%" stop-color="#ec4899"/>
                        </linearGradient>
                      </defs>
                      <rect x="3.5" y="9" width="3" height="6" rx="1.5" fill="url(#gradPulseD_call)" opacity="0.6"/>
                      <rect x="8.5" y="4.5" width="3" height="15" rx="1.5" fill="url(#gradPulseD_call)"/>
                      <rect x="13.5" y="7.5" width="3" height="9" rx="1.5" fill="url(#gradPulseD_call)" opacity="0.85"/>
                      <rect x="18.5" y="10.5" width="3" height="3" rx="1.5" fill="url(#gradPulseD_call)" opacity="0.45"/>
                    </svg>
                  </span>
                  <span class="capsule-text" data-i18n="effect_pulsing">脉动</span>
                  <span class="check-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </span>
                </button>
              </div>
            </div>
          </div>
          <div class="setting-divider"></div>
          <div class="color-module-wrapper">
            <div class="section-title-row">
              <span class="setting-label" data-i18n="color_select">颜色选择</span>
              <span class="current-color-hint" id="colorHint_call_main" data-i18n="color_dark_green">深绿</span>
            </div>

            <!-- 6个中空光环预设 + 垂直蓝色分割线 -->
            <div class="color-presets-row" id="colorPresets_call_main">
              <button type="button" class="color-ring-btn ring-green active" data-color="#00e600" data-name-key="color_grass_green" onclick="selectSceneColor('call', '#00e600', 'color_grass_green', 'main')" aria-label="绿色"></button>
              <button type="button" class="color-ring-btn ring-orange" data-color="#ffa850" data-name-key="color_peach_orange" onclick="selectSceneColor('call', '#ffa850', 'color_peach_orange', 'main')" aria-label="橙色"></button>
              <button type="button" class="color-ring-btn ring-blue" data-color="#4ca8ff" data-name-key="color_fog_blue" onclick="selectSceneColor('call', '#4ca8ff', 'color_fog_blue', 'main')" aria-label="蓝色"></button>
              <button type="button" class="color-ring-btn ring-cyan" data-color="#00f5e6" data-name-key="color_cyan_blue" onclick="selectSceneColor('call', '#00f5e6', 'color_cyan_blue', 'main')" aria-label="青色"></button>
              <div class="color-preset-divider"></div>
              <button type="button" class="color-ring-btn ring-rainbow" data-effect="color_rhythm" data-name-key="effect_color_rhythm" onclick="selectSceneColorRing('call', 'rainbow', 'main')" aria-label="彩色律动"></button>
              <button type="button" class="color-ring-btn ring-four-color" data-effect="four_color" data-name-key="effect_four_color" onclick="selectSceneColorRing('call', 'four_color', 'main')" aria-label="四色律动"></button>
            </div>

            <!-- 全彩拾色大圆盘 -->
            <div class="color-wheel-wrapper">
              <div class="color-wheel-box" id="colorWheel_call_main" onclick="pickSceneWheelColor(event, 'call', 'main')">
                <img src="./assets/color_wheel_hd.png" alt="Color Wheel" class="wheel-hd-img">
                <div class="wheel-picker-thumb" id="wheelThumb_call_main" style="left: 35%; top: 90%;">
                  <span class="thumb-core" id="thumbCore_call_main" style="background-color: #00e600;"></span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- 卡片三：通话中呼吸及专属颜色 -->
        <section class="settings-card">
          <div class="setting-row">
            <span class="setting-label" data-i18n="in_call_breathing">通话中呼吸</span>
            <label class="switch-toggle">
              <input type="checkbox" id="switch_inCallBreathe" checked onchange="toggleInCallBreathe(this.checked)">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="setting-divider"></div>
          <div class="color-module-wrapper">
            <div class="section-title-row">
              <span class="setting-label" data-i18n="color_select">颜色选择</span>
              <span class="current-color-hint" id="colorHint_call_incall" data-i18n="color_dark_green">深绿</span>
            </div>

            <!-- 6个中空光环预设 + 垂直蓝色分割线 -->
            <div class="color-presets-row" id="colorPresets_call_incall">
              <button type="button" class="color-ring-btn ring-green active" data-color="#00e600" data-name-key="color_grass_green" onclick="selectSceneColor('call', '#00e600', 'color_grass_green', 'incall')" aria-label="绿色"></button>
              <button type="button" class="color-ring-btn ring-orange" data-color="#ffa850" data-name-key="color_peach_orange" onclick="selectSceneColor('call', '#ffa850', 'color_peach_orange', 'incall')" aria-label="橙色"></button>
              <button type="button" class="color-ring-btn ring-blue" data-color="#4ca8ff" data-name-key="color_fog_blue" onclick="selectSceneColor('call', '#4ca8ff', 'color_fog_blue', 'incall')" aria-label="蓝色"></button>

                      <circle cx="12" cy="20" r="1.4" fill="url(#gradBreathing_power)"/>
                      <circle cx="6" cy="18" r="1.3" fill="url(#gradBreathing_power)"/>
                      <circle cx="4" cy="12" r="1.4" fill="url(#gradBreathing_power)"/>
                      <circle cx="6" cy="6" r="1.3" fill="url(#gradBreathing_power)"/>
                    </svg>
                  </span>
                  <span class="capsule-text" data-i18n="effect_breathing">呼吸</span>
                  <span class="check-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </span>
                </button>
                <!-- 脉动 -->
                <button type="button" class="capsule-btn active" data-effect="pulsing" onclick="selectSceneEffect('power', 'pulsing')">
                  <span class="capsule-icon">
                    <svg viewBox="0 0 24 24" fill="none">
                      <defs>
                        <linearGradient id="gradPulseD_power" x1="0%" y1="100%" x2="0%" y2="0%">
                          <stop offset="0%" stop-color="#f59e0b"/>
                          <stop offset="50%" stop-color="#ef4444"/>
                          <stop offset="100%" stop-color="#ec4899"/>
                        </linearGradient>
                      </defs>
                      <rect x="3.5" y="9" width="3" height="6" rx="1.5" fill="url(#gradPulseD_power)" opacity="0.6"/>
                      <rect x="8.5" y="4.5" width="3" height="15" rx="1.5" fill="url(#gradPulseD_power)"/>
                      <rect x="13.5" y="7.5" width="3" height="9" rx="1.5" fill="url(#gradPulseD_power)" opacity="0.85"/>
                      <rect x="18.5" y="10.5" width="3" height="3" rx="1.5" fill="url(#gradPulseD_power)" opacity="0.45"/>
                    </svg>
                  </span>
                  <span class="capsule-text" data-i18n="effect_pulsing">脉动</span>
                  <span class="check-badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                  </span>
                </button>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- 场景视图 7: 启用时段 (时间段设置) -->
      <div class="page-view" id="view_active_time">
        <!-- 模式选择卡片：全天启用 / 定时启用 -->
        <section class="settings-card" style="margin-top: 10px;">
          <div class="setting-row clickable" onclick="setActiveTimeMode('all_day')">
            <span class="setting-label" data-i18n="active_time_all_day">全天启用</span>
            <label class="custom-radio">
              <input type="radio" name="active_time_mode" id="radio_all_day" onchange="setActiveTimeMode('all_day')">
              <span class="radio-indicator"></span>
            </label>
          </div>
          <div class="setting-divider"></div>
          <div class="setting-row clickable" onclick="setActiveTimeMode('scheduled')">
            <span class="setting-label" data-i18n="active_time_scheduled">定时启用</span>
            <label class="custom-radio">
              <input type="radio" name="active_time_mode" id="radio_scheduled" checked onchange="setActiveTimeMode('scheduled')">
              <span class="radio-indicator"></span>
            </label>
          </div>
        </section>

        <!-- 定时设置卡片：开始时间 / 结束时间 -->
        <section class="settings-card" id="card_time_picker">
          <div class="setting-row clickable" onclick="triggerTimeEdit('start')">
            <span class="setting-label" data-i18n="time_start">开始</span>
            <div class="row-meta">
              <span class="row-status time-val" id="text_start_time">14:26</span>
              <svg class="row-chevron" width="8" height="15" viewBox="0 0 8 15" fill="none">
                <path d="M 1.5 1.5 L 6.5 7.5 L 1.5 13.5" stroke="#c2c2c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <input type="time" id="input_start_time" value="14:26" class="hidden-time-input" onchange="updateScheduledTime('start', this.value)">
          </div>
          <div class="setting-divider"></div>
          <div class="setting-row clickable" onclick="triggerTimeEdit('end')">
            <span class="setting-label" data-i18n="time_end">结束</span>
            <div class="row-meta">
              <span class="row-status time-val" id="text_end_time">23:00</span>
              <svg class="row-chevron" width="8" height="15" viewBox="0 0 8 15" fill="none">
                <path d="M 1.5 1.5 L 6.5 7.5 L 1.5 13.5" stroke="#c2c2c2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <input type="time" id="input_end_time" value="23:00" class="hidden-time-input" onchange="updateScheduledTime('end', this.value)">
          </div>
        </section>
      </div>

      <!-- 底部安全区条 -->
      <footer class="home-indicator">
        <div class="bar"></div>
      </footer>
      <!-- 移动端语言切换抽屉 -->
      <div class="lang-modal-backdrop" id="langModalBackdrop" onclick="toggleLanguageSheet(false)">
        <div class="lang-bottom-sheet" onclick="event.stopPropagation()">
          <div class="sheet-handle"></div>
          <div class="sheet-header">
            <span class="sheet-title">选择系统语言 / Language</span>
            <button type="button" class="sheet-close" onclick="toggleLanguageSheet(false)">✕</button>
          </div>
          <div class="sheet-lang-list">
            <button type="button" class="sheet-lang-btn active" data-lang="zh-CN" onclick="selectAppLanguage('zh-CN')">🇨🇳 中文 (简体)</button>
            <button type="button" class="sheet-lang-btn" data-lang="en-US" onclick="selectAppLanguage('en-US')">🇺🇸 English (US)</button>
            <button type="button" class="sheet-lang-btn" data-lang="de-DE" onclick="selectAppLanguage('de-DE')">🇩🇪 Deutsch</button>
            <button type="button" class="sheet-lang-btn" data-lang="es-ES" onclick="selectAppLanguage('es-ES')">🇪🇸 Español</button>
            <button type="button" class="sheet-lang-btn" data-lang="ru-RU" onclick="selectAppLanguage('ru-RU')">🇷🇺 Русский</button>
            <button type="button" class="sheet-lang-btn" data-lang="fr-FR" onclick="selectAppLanguage('fr-FR')">🇫🇷 Français</button>
            <button type="button" class="sheet-lang-btn" data-lang="ja-JP" onclick="selectAppLanguage('ja-JP')">🇯🇵 日本語</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
